services:
  mysql:
    image: mysql:8.4
    container_name: pixy-shared-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - pixy_shared_mysql_data:/var/lib/mysql
    secrets:
      - mysql_root_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt

volumes:
  pixy_shared_mysql_data:
    name: pixy_shared_mysql_data
